config:
  backup: true
  banner: true
  create: true
  dotpath: dotfiles
  keepdot: false
  link_dotfile_default: nolink
  link_on_import: nolink
  longkey: false

dotfiles:
  d_nvim:
    src: config/nvim
    dst: ~/.config/nvim
    ignore_missing_in_dotdrop: true
  d_powerline:
    src: config/powerline
    dst: ~/.config/powerline
    chmod: '775'
  d_wezterm:
    src: config/wezterm
    dst: ~/.config/wezterm
    ignore_missing_in_dotdrop: true
  f_plug.vim:
    src: local/share/nvim/site/autoload/plug.vim
    dst: ~/.local/share/nvim/site/autoload/plug.vim
  f_init.lua:
    src: config/nvim/init.lua
    dst: ~/.config/nvim/init.lua
  f_bash_aliases:
    src: bash_aliases
    dst: ~/.bash_aliases
  f_gitconfig:
    src: gitconfig
    dst: ~/.gitconfig
  f_spitfire.sh:
    src: config/rc/spitfire.sh
    dst: ~/.config/rc/spitfire.sh
  f_most.sh:
    src: config/rc/most.sh
    dst: ~/.config/rc/most.sh
  f_vcpkg.sh:
    src: config/rc/vcpkg.sh
    dst: ~/.config/rc/vcpkg.sh
  f_wezterm.sh:
    src: config/rc/wezterm.sh
    dst: ~/.config/rc/wezterm.sh
  f_0-bash.sh:
    src: config/rc/pre/0-bash.sh
    dst: ~/.config/rc/pre/0-bash.sh
  f_1-mac.sh:
    src: config/rc/pre/1-mac.sh
    dst: ~/.config/rc/pre/1-mac.sh
  f_1-pyenv.sh:
    src: config/rc/pre/1-pyenv.sh
    dst: ~/.config/rc/pre/1-pyenv.sh
  f_2-direnv.sh:
    src: config/rc/pre/2-direnv.sh
    dst: ~/.config/rc/pre/2-direnv.sh
  f_wezterm-completion:
    src: config/rc/.wezterm-completion
    dst: ~/.config/rc/.wezterm-completion
  f_wezterm_wayland.lua:
    src: config/wezterm-mixins/wayland.lua
    dst: ~/.config/wezterm/mixins/wayland.lua
  f_ensure_toolchains:
    src: scripts/ensure-toolchains.sh
    dst: ~/.local/bin/ensure-toolchains.sh
    chmod: '755'
  f_tools.toml:
    src: config/tools.toml
    dst: ~/.config/tools.toml
  f_install_tools:
    src: scripts/install-tools.py
    dst: ~/.local/bin/install-tools.py
    chmod: '755'
  f_init_profile:
    src: scripts/init-profile.py
    dst: ~/.local/bin/init-profile.py
    chmod: '755'
  d_skill_terminal_pane_display:
    src: config/agents/skills/terminal-pane-display
    dst: ~/.config/agents/skills/terminal-pane-display
  f_link_agent_skills:
    src: scripts/link-agent-skills.sh
    dst: ~/.local/bin/link-agent-skills.sh
    chmod: '755'
  d_agents_rules:
    src: config/agents/rules
    dst: ~/.config/agents/rules
  f_rclone_gdrive.service:
    src: config/systemd/user/rclone-gdrive.service
    dst: ~/.config/systemd/user/rclone-gdrive.service
  f_rclone_shared.service:
    src: config/systemd/user/rclone-shared.service
    dst: ~/.config/systemd/user/rclone-shared.service

actions:
  persist_dotfiles_dir: bash "{{@@ _dotdrop_dotpath @@}}/scripts/persist-dotfiles-dir.sh" "{{@@ _dotdrop_cfgpath @@}}"
  ensure_toolchains: ~/.local/bin/ensure-toolchains.sh
  install_shell_tools: ~/.local/bin/install-tools.py --group shell
  install_neovim_tools: ~/.local/bin/install-tools.py --group neovim
  install_wezterm: ~/.local/bin/install-tools.py --group wezterm
  seed_wezterm_local: bash "{{@@ _dotdrop_dotpath @@}}/scripts/seed-wezterm-local.sh"
  install_terminal_tools: ~/.local/bin/install-tools.py --group terminal
  install_user_tools: ~/.local/bin/install-tools.py --group user
  install_rclone: ~/.local/bin/install-tools.py --group rclone
  setup_rclone_mount: mkdir -p ~/GoogleDrive ~/SharedDrives ~/.cache/rclone && systemctl --user daemon-reload
  link_gemini_skills: ~/.local/bin/link-agent-skills.sh gemini
  link_claude_skills: ~/.local/bin/link-agent-skills.sh claude

profiles:
  bash:
    dotfiles:
      - f_0-bash.sh
      - d_powerline
      - f_bash_aliases
      - f_ensure_toolchains
      - f_tools.toml
      - f_install_tools
    actions:
      - persist_dotfiles_dir
      - ensure_toolchains
      - install_shell_tools

  neovim:
    dotfiles:
      - d_nvim
      - f_plug.vim
      - f_init.lua
      - f_ensure_toolchains
      - f_tools.toml
      - f_install_tools
    actions:
      - ensure_toolchains
      - install_neovim_tools

  wezterm:
    include: [bash]
    dotfiles:
      - d_wezterm
      - f_wezterm.sh
      - f_wezterm-completion
      - d_skill_terminal_pane_display
    actions:
      - seed_wezterm_local
      - install_wezterm
      - install_terminal_tools

  wsl:
    include: [bash, neovim, user]
    actions:
      - install_terminal_tools

  user:
    dotfiles:
      - f_ensure_toolchains
      - f_tools.toml
      - f_install_tools
      - f_init_profile
      - d_agents_rules
    actions:
      - ensure_toolchains
      - install_user_tools

  gemini:
    dotfiles:
      - f_link_agent_skills
    actions:
      - link_gemini_skills

  claude:
    dotfiles:
      - f_link_agent_skills
    actions:
      - link_claude_skills

  wayland:
    dotfiles:
      - f_wezterm_wayland.lua

  git:
    dotfiles:
      - f_gitconfig

  rclone:
    dotfiles:
      - f_tools.toml
      - f_install_tools
      - f_rclone_gdrive.service
      - f_rclone_shared.service
    actions:
      - install_rclone
      - setup_rclone_mount

  bose:
    include: [bash, neovim]
    dotfiles:
      - f_spitfire.sh

  hotel-laptop.local:
    include: [wezterm, neovim, user, gemini, claude]
    dotfiles:
      - f_most.sh
      - f_1-mac.sh
      - f_1-pyenv.sh
      - f_2-direnv.sh
      - f_vcpkg.sh

  hotel-laptop-2.local:
    include: [wezterm, neovim, user, gemini, git]
    dotfiles:
      - f_most.sh
      - f_1-mac.sh
      - f_1-pyenv.sh
      - f_2-direnv.sh
      - f_vcpkg.sh

  rise-33:
    include: [wezterm, neovim, user, wayland, claude, git, rclone]
