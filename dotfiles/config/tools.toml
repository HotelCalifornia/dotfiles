# Declarative manifest for CLI tools managed via uv, cargo, and github-release.
# Consumed by install-tools.py during dotdrop execution.
# Tools can be scoped to specific profiles using the `group` (or `groups`) attribute.

# --- Shell / Prompt Dependencies ---
[tools.powerline-status]
manager = "uv"
group = "shell"

# --- Terminal Emulator Dependencies ---
[tools.wezterm]
manager = "github-release"
group = "wezterm"
command = "wezterm"
repo = "wezterm/wezterm"
asset = "WezTerm-.*\\.AppImage$"
brew_cask = "wezterm"
app_bundle = "/Applications/WezTerm.app"
skip_wsl = true
desktop_entry = true
desktop_name = "WezTerm"
desktop_comment = "Wez's Terminal Emulator"
desktop_categories = "System;TerminalEmulator;Utility;"
icon_name = "wezterm"

# --- Terminal Theming & Tools (works with WezTerm and Windows Terminal in WSL) ---
[tools.pokemon-terminal]
manager = "uv"
group = "terminal"
command = "pokemon"
fork = "git+https://github.com/HotelCalifornia/Pokemon-Terminal.git"
local_paths = [
    "~/Developer/Pokemon-Terminal",
    "~/src/Pokemon-Terminal",
    "~/.local/src/Pokemon-Terminal",
]

# --- Editor Dependencies ---
[tools.neovim]
manager = "github-release"
group = "neovim"
command = "nvim"
repo = "neovim/neovim"
asset = "nvim-linux-{arch}.appimage$"
brew = "neovim"
desktop_entry = true
desktop_name = "Neovim"
desktop_comment = "Vim-fork focused on extensibility and usability"
desktop_terminal = true
desktop_categories = "Utility;TextEditor;Development;"
icon_name = "nvim"

# --- General CLI Utilities (Cargo, UV, GitHub Release) ---
[tools.du-dust]
manager = "cargo"
group = "user"
command = "dust"

[tools.eza]
manager = "cargo"
group = "user"

[tools.bat]
manager = "cargo"
group = "user"

[tools.ripgrep]
manager = "cargo"
group = "user"
command = "rg"

[tools.glow]
manager = "github-release"
group = "user"
command = "glow"
repo = "charmbracelet/glow"
asset = "glow_.*_Linux_{arch}\\.tar\\.gz$"
brew = "glow"

[tools.termaid]
manager = "uv"
group = "user"

# --- Desktop Applications ---
[tools.obsidian]
manager = "github-release"
group = "apps"
command = "obsidian"
repo = "obsidianmd/obsidian-releases"
# x86_64 AppImage has no arch suffix; arm64 is "-arm64"
asset = "^Obsidian-[0-9.]+{arch}\\.AppImage$"
arch_map = { x86_64 = "", arm64 = "-arm64" }
# Electron's sandbox fails where unprivileged user namespaces are restricted
# (kernel.apparmor_restrict_unprivileged_userns = 1, Ubuntu 24.04+)
exec_args = ["--no-sandbox"]
brew_cask = "obsidian"
app_bundle = "/Applications/Obsidian.app"
skip_wsl = true
desktop_entry = true
desktop_name = "Obsidian"
desktop_comment = "Knowledge base and note-taking on local Markdown files"
desktop_categories = "Office;TextEditor;"
icon_name = "obsidian"

[tools.jetbrains-toolbox]
manager = "github-release"
source = "jetbrains"
product_code = "TBA"
group = "apps"
command = "jetbrains-toolbox"
# Tarball is a full app tree (bundled JRE + libs), not a single binary
extract = "full"
binary_path = "bin/jetbrains-toolbox"
# After first launch Toolbox installs and updates itself here, and creates
# its own desktop entry and autostart, so this installer only bootstraps it.
installed_paths = ["~/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox"]
post_install_note = "run 'jetbrains-toolbox' once; it then installs and updates itself under ~/.local/share/JetBrains/Toolbox"
brew_cask = "jetbrains-toolbox"
app_bundle = "/Applications/JetBrains Toolbox.app"
skip_wsl = true

# --- Cloud Storage ---
[tools.rclone]
manager = "github-release"
group = "rclone"
command = "rclone"
repo = "rclone/rclone"
asset = "rclone-v[0-9.]+-linux-{arch}\\.zip$"
arch_map = { x86_64 = "amd64", arm64 = "arm64" }
brew = "rclone"
